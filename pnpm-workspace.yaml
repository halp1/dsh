packages:
  - plugins/*

# One version of every shared dev tool and DSH package for the whole repo.
# Bump DSH here when the host upgrades, then run `pnpm install`.
catalog:
  '@deepseek-ai/cordis': 4.1.0
  '@deepseek-ai/cordis-plugin-group': 1.1.0
  '@deepseek-ai/cordis-plugin-include': 1.1.0
  '@deepseek-ai/cordis-plugin-loader': 1.1.0
  '@deepseek-ai/schemastery': 3.19.0
  '@types/node': ^24.9.0
  tsdown: ^0.22.2
  tsx: ^4.23.15
  typescript: ^6.0.3
  # The host's browser runtime ships React 18.3.
  react: ^18.3.1
  react-dom: ^18.3.1
  '@types/react': ~18.3.1
  '@types/react-dom': ~18.3.1

catalogs:
  # Matches the running host. Every @deepseek-ai/dsh-* devDependency uses `catalog:dsh`.
  dsh:
    '@deepseek-ai/dsh-agent': 0.2.2-rc.1
    '@deepseek-ai/dsh-agent-default-model': 0.2.2-rc.1
    '@deepseek-ai/dsh-agent-preset-registry': 0.2.2-rc.1
    '@deepseek-ai/dsh-api-gateway': 0.2.2-rc.1
    '@deepseek-ai/dsh-api-remotes': 0.2.2-rc.1
    '@deepseek-ai/dsh-api-session-controller': 0.2.2-rc.1
    '@deepseek-ai/dsh-api-workspace-controller': 0.2.2-rc.1
    '@deepseek-ai/dsh-app-boot': 0.2.2-rc.1
    '@deepseek-ai/dsh-atomic-write': 0.2.2-rc.1
    '@deepseek-ai/dsh-attachment': 0.2.2-rc.1
    '@deepseek-ai/dsh-brand': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-connection': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-file-upload': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-locale': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-store': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-ui-commands': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-ui-conversation': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-ui-primitives': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-ui-renderer': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-ui-session': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-ui-settings': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-ui-sidebar': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-ui-slots': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-ui-theme': 0.2.2-rc.1
    '@deepseek-ai/dsh-client-ui-workspace': 0.2.2-rc.1
    '@deepseek-ai/dsh-commands': 0.2.2-rc.1
    '@deepseek-ai/dsh-compaction': 0.2.2-rc.1
    '@deepseek-ai/dsh-credentials': 0.2.2-rc.1
    '@deepseek-ai/dsh-file-reference': 0.2.2-rc.1
    '@deepseek-ai/dsh-fs': 0.2.2-rc.1
    '@deepseek-ai/dsh-home-paths': 0.2.2-rc.1
    '@deepseek-ai/dsh-host-webserver': 0.2.2-rc.1
    '@deepseek-ai/dsh-invariants': 0.2.0-rc.2
    '@deepseek-ai/dsh-launch-environment': 0.2.2-rc.1
    '@deepseek-ai/dsh-llm': 0.2.2-rc.1
    '@deepseek-ai/dsh-native-command': 0.2.2-rc.1
    '@deepseek-ai/dsh-ptc-runtime': 0.2.2-rc.1
    '@deepseek-ai/dsh-sandbox': 0.2.2-rc.1
    '@deepseek-ai/dsh-sandbox-policy': 0.2.2-rc.1
    '@deepseek-ai/dsh-scope': 0.2.2-rc.1
    '@deepseek-ai/dsh-session': 0.2.2-rc.1
    '@deepseek-ai/dsh-session-persistence': 0.2.2-rc.1
    '@deepseek-ai/dsh-session-projection': 0.2.2-rc.1
