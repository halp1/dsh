    '@deepseek-ai/dsh-working-directory': 0.2.2-rc.1
    '@deepseek-ai/dsh-workspace': 0.2.2-rc.1

minimumReleaseAgeExclude:
  - '@deepseek-ai/*'

allowBuilds:
  electron: true
  esbuild: true

# The DSH host supplies peers at runtime. Dev copies come from devDependencies.
autoInstallPeers: false
storeDir: .pnpm-store
