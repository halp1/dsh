# Bundle self-activation patch: mounts this plugin's (empty) node half when the
# package is installed into a profile via
#   dsh plugin --profile web add file:~/code/dsh/dsh-plugin-badge
#
# The row exists so the Loader sees the package; the real work lives in the
# browser half, which the client-modules scanner discovers through this
# package.json's `dsh.client` declaration and serves as /plugins/<id>/client.js.
#
# The browser half's presentation knobs are per-device rather than per-profile
# (whether this particular browser is an installed PWA decides whether a badge
# is even visible), so they persist in localStorage under `dsh.badge.settings`
# and are edited through `ctx.badge` from the devtools console rather than
# through this row's config.
#
- insert:
    - id: badge
      name: dsh-plugin-badge
